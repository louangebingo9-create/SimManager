<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SimLiGA Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1A14;--panel:#16261E;--line:#2A3F34;--chalk:#F3EFE3;--mute:#9DB0A4;--gold:#E8B84A;--red:#E0604F;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--chalk);font:400 15px/1.5 Inter,system-ui,sans-serif}
h1{font-family:Fraunces,Georgia,serif;margin:0;font-size:22px;letter-spacing:-.01em}
strong{font-weight:700}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
#app{max-width:520px;margin:0 auto;padding:16px 16px 100px}
.head{display:flex;align-items:center;gap:12px;padding:8px 0 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.grow{flex:1;min-width:0}
.muted{color:var(--mute);font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pos{font-size:11px;font-weight:700;width:34px;color:var(--gold)}
.ovr{font-family:Fraunces,Georgia,serif;font-size:20px;font-weight:800;min-width:38px;text-align:right}
.btn{padding:9px 14px;border:1px solid var(--gold);color:var(--gold);border-radius:10px;font-weight:600;font-size:13px;white-space:nowrap}
.btn.solid{background:var(--gold);color:#0E1A14}
.btn.red{border-color:var(--red);color:var(--red)}
.clubs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.club{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-align:center;font-size:13px;line-height:1.25}
.club span{font-size:12px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs[hidden]{display:none}
.tabs button{flex:1;padding:14px 0 14px;font-size:12px;color:var(--mute);text-align:center}
.tabs button[aria-current="page"]{color:var(--gold);font-weight:700}
.big{font-family:Fraunces,Georgia,serif;font-size:34px;font-weight:800;margin-top:8px}
.score{font-family:Fraunces,Georgia,serif;font-size:26px;font-weight:800;text-align:center;margin:18px 0 12px}
.log{font-size:13px;color:var(--mute);padding:8px 0;border-bottom:1px dashed var(--line)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--gold);color:#0E1A14;padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px;max-width:90%;z-index:9}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E1A14">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs" hidden></nav>
<script>
const CLUBS=[
 {n:"SimCity FC",city:"SimCity",a:"#1F4E9C",s:"#FFFFFF",o:84,m:180},
 {n:"NewCrest United",city:"NewCrest",a:"#111827",s:"#D4AF37",o:86,m:260},
 {n:"San Myshuno Royals",city:"San Myshuno",a:"#7A1E3A",s:"#F5E6C8",o:83,m:240},
 {n:"Bavaria FC",city:"Limestone Criffs",a:"#0B5D3B",s:"#FFFFFF",o:74,m:90},
 {n:"Heineken FC",city:"Limestone Criffs",a:"#D71920",s:"#FFFFFF",o:76,m:140},
 {n:"Inter Zenith",city:"Granite Falls",a:"#0A2A6B",s:"#E10600",o:75,m:110},
 {n:"Zenith FC",city:"Granite Falls",a:"#2D6A4F",s:"#B7E4C7",o:73,m:80},
 {n:"Del Sol Valley Stars",city:"Del Sol Valley",a:"#F4A300",s:"#1B1B1B",o:77,m:130},
 {n:"Inter Hindiana",city:"Magnolia Promenade",a:"#1E88E5",s:"#0D47A1",o:79,m:150},
 {n:"Llamas FC",city:"Myshoria",a:"#6B3E26",s:"#F2C14E",o:72,m:75},
 {n:"Princetown FC",city:"San Myshuno",a:"#5E2A84",s:"#E0C3FC",o:74,m:95},
 {n:"Willow Creek FC",city:"Willow Creek",a:"#3A7D44",s:"#F1FAEE",o:70,m:60},
 {n:"Norwich United",city:"SimCity",a:"#2B2D42",s:"#8D99AE",o:78,m:150},
 {n:"Viridian Forest FC",city:"SimCity",a:"#1B9E77",s:"#0B3D2E",o:71,m:55},
 {n:"Windenburg SC",city:"Windenburg",a:"#7B2CBF",s:"#FFD166",o:72,m:70},
 {n:"Britechester AC",city:"Brindleton Bay",a:"#003566",s:"#FFC300",o:73,m:85},
 {n:"Trinity Borough FC",city:"SimCity",a:"#6C757D",s:"#F8F9FA",o:64,m:35},
 {n:"Tomarang",city:"Magnolia Promenade",a:"#E85D04",s:"#370617",o:66,m:45},
 {n:"Dynamo Northwood",city:"NewCrest",a:"#00B4D8",s:"#03045E",o:69,m:60},
 {n:"Stahlstadt United",city:"Limestone Criffs",a:"#9D0208",s:"#6A040F",o:68,m:50}
];
const POS=["GK","DEF","MID","ATT"];
const SLOTS=[["GK",2],["DEF",6],["MID",6],["ATT",4]];
const S={view:"squad",st:null};
const $=id=>document.getElementById(id);
const fmt=n=>"§ "+n.toFixed(1)+" M";
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const rnd=a=>a[Math.floor(Math.random()*a.length)];

/* Noms générés : structures CV/CVC, sans copier de noms existants */
const CONS="ktvrsmldznbfh",VOW="aeiouy";
const syl=()=>rnd(CONS)+rnd(VOW)+(Math.random()<.4?rnd(CONS):"");
const word=k=>{let w="";for(let i=0;i<k;i++)w+=syl();return w[0].toUpperCase()+w.slice(1)};
const pname=()=>word(2)+" "+word(Math.random()<.5?2:3);

function mkP(pos,ovr){
  return{id:Math.random().toString(36).slice(2),name:pname(),pos,ovr,
    salary:Math.max(.1,Math.round(((ovr-60)/10)**2*8)/10),
    price:Math.max(1,Math.round(((ovr-55)/10)**2*12))};
}
function makeSquad(c){
  const sq=[];
  for(const[pos,n]of SLOTS)for(let i=0;i<n;i++)
    sq.push(mkP(pos,clamp(Math.round(c.o+Math.random()*16-8+(pos==="ATT"?2:0)),50,94)));
  return sq;
}
const newMarket=()=>Array.from({length:8},()=>mkP(rnd(POS),clamp(Math.round(60+Math.random()*24),60,86)));
const bill=s=>s.squad.reduce((t,p)=>t+p.salary,0);
const avgTop=s=>{const t=[...s.squad].sort((a,b)=>b.ovr-a.ovr).slice(0,11);return t.reduce((x,p)=>x+p.ovr,0)/t.length};
const teamOvr=s=>Math.round(avgTop(s));
function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}

function initials(n){return n.split(" ").filter(w=>/^[A-Za-z]/.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join("")}
function crest(c,size=44){
  return `<svg width="${size}" height="${Math.round(size*1.1)}" viewBox="0 0 40 44" aria-hidden="true">
<path d="M2 2h36v24c0 9-8 14-18 17C10 40 2 35 2 26z" fill="${c.a}" stroke="${c.s}" stroke-width="2.5"/>
<path d="M2 2h36v9H2z" fill="${c.s}"/>
<text x="20" y="32" text-anchor="middle" font-family="Inter,sans-serif" font-weight="800" font-size="11" fill="${c.s}">${initials(c.n)}</text></svg>`;
}

function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

function start(i){
  const c=CLUBS[i];
  S.st={club:c,squad:makeSquad(c),cash:c.m,p:0,w:0,d:0,l:0,gf:0,ga:0,log:[],market:newMarket()};
  S.view="squad";render();
}
function reset(){S.st=null;render()}
function go(k){S.view=k;render()}

function play(){
  const s=S.st;
  if(s.p>=38)return newSeason();
  let opp;do{opp=rnd(CLUBS)}while(opp===s.club);
  const own=avgTop(s),home=Math.random()<.5;
  const g1=poisson(1.3*(own/opp.o)**3),g2=poisson(1.3*(opp.o/own)**3);
  s.p++;s.gf+=g1;s.ga+=g2;
  s.cash-=bill(s)/38;
  if(home)s.cash+=1.5;
  let res;
  if(g1>g2){s.w++;s.cash+=.5;res="Victoire"}
  else if(g1===g2){s.d++;res="Nul"}
  else{s.l++;res="Défaite"}
  s.log.unshift(`J${s.p} · ${res} ${g1}-${g2} contre ${opp.n} ${home?"(domicile)":"(extérieur)"}`);
  s.log=s.log.slice(0,30);
  render();
}
function newSeason(){
  const s=S.st;
  Object.assign(s,{p:0,w:0,d:0,l:0,gf:0,ga:0,log:[]});
  s.cash+=5;
  toast("Nouvelle saison, sponsors contents 💰");render();
}
function buy(id){
  const s=S.st,p=s.market.find(x=>x.id===id);
  if(s.cash<p.price)return toast("Pas assez de cash 💸");
  if(s.squad.length>=26)return toast("Effectif plein (26 max)");
  s.cash-=p.price;s.squad.push(p);
  s.market=s.market.filter(x=>x.id!==id);
  toast(`${p.name} signé ✍️`);render();
}
function sell(id){
  const s=S.st,p=s.squad.find(x=>x.id===id);
  if(s.squad.length<=16)return toast("Minimum 16 joueurs");
  s.squad=s.squad.filter(x=>x.id!==id);
  s.cash+=Math.round(p.price*.7);
  toast(`${p.name} vendu à ${fmt(Math.round(p.price*.7))}`);render();
}
function refreshMarket(){S.st.market=newMarket();render()}

function pickView(){
  return `<header class="head"><div class="grow"><h1>SimLiGA Manager</h1><div class="muted">Choisis ton club. 20 clubs, un seul titre. ⚽</div></div></header>
<div class="clubs">${CLUBS.map((c,i)=>`<button class="club" onclick="start(${i})">${crest(c,52)}<strong>${c.n}</strong><span class="muted">${c.city} · ${c.o}</span></button>`).join("")}</div>`;
}
function squadView(s){
  const list=[...s.squad].sort((a,b)=>POS.indexOf(a.pos)-POS.indexOf(b.pos)||b.ovr-a.ovr);
  return `<p class="muted">${s.squad.length} joueurs · masse salariale ${fmt(bill(s))}/an</p>`+
    list.map(p=>`<div class="row"><span class="pos">${p.pos}</span><div class="grow"><div>${p.name}</div><div class="muted">salaire ${fmt(p.salary)}/an</div></div><span class="ovr">${p.ovr}</span><button class="btn red" onclick="sell('${p.id}')" ${s.squad.length<=16?"disabled":""}>Vendre</button></div>`).join("");
}
function marketView(s){
  return `<div class="row"><div class="grow"><strong>Cash dispo</strong><div class="muted">${fmt(s.cash)}</div></div><button class="btn" onclick="refreshMarket()">Renouveler</button></div>`+
    s.market.map(p=>`<div class="row"><span class="pos">${p.pos}</span><div class="grow"><div>${p.name}</div><div class="muted">${fmt(p.price)} · salaire ${fmt(p.salary)}/an</div></div><span class="ovr">${p.ovr}</span><button class="btn solid" onclick="buy('${p.id}')">Acheter</button></div>`).join("");
}
function finView(s){
  return `<div class="muted">Trésorerie du club</div><div class="big">${fmt(s.cash)}</div>
<div class="row" style="margin-top:14px"><div class="grow">Salaires par saison</div><strong>${fmt(bill(s))}</strong></div>
<div class="row"><div class="grow">Coût par match</div><strong>${fmt(bill(s)/38)}</strong></div>
<div class="row"><div class="grow">Recette à domicile</div><strong>+ § 1,5 M</strong></div>
<div class="row"><div class="grow">Prime de victoire</div><strong>+ § 0,5 M</strong></div>
<p class="muted" style="margin-top:14px">${s.cash<0?"⚠️ Découvert : la FCB commence à regarder ton dossier de travers.":"Tu es dans les clous, pour l'instant."}</p>`;
}
function matchView(s){
  return `<div class="muted" style="text-align:center">Journée ${Math.min(s.p+1,38)} / 38 · ${s.w}V ${s.d}N ${s.l}D · ${3*s.w+s.d} pts · buts ${s.gf}-${s.ga}</div>
<div class="score">${s.p<38?"Prochain match":"Saison terminée"}</div>
<div style="text-align:center"><button class="btn solid" onclick="play()">${s.p<38?"Jouer la journée":"Nouvelle saison"}</button></div>
<div style="margin-top:20px">${s.log.map(l=>`<div class="log">${l}</div>`).join("")||'<p class="muted" style="text-align:center">Pas encore de match. Le vestiaire attend. 🏟️</p>'}</div>`;
}

function render(){
  const app=$("app");
  if(!S.st){app.innerHTML=pickView();$("tabs").hidden=true;return}
  $("tabs").hidden=false;
  const s=S.st;
  const body={squad:squadView,market:marketView,fin:finView,match:matchView}[S.view](s);
  app.innerHTML=`<header class="head">${crest(s.club,46)}<div class="grow"><h1>${s.club.n}</h1><div class="muted">${s.club.city} · Ovr ${teamOvr(s)}</div></div><button class="btn" onclick="reset()">Club</button></header>${body}`;
  $("tabs").innerHTML=[["squad","Effectif"],["market","Mercato"],["fin","Finances"],["match","Match"]]
    .map(([k,l])=>`<button onclick="go('${k}')" ${S.view===k?'aria-current="page"':""}>${l}</button>`).join("");
}
render();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js");}</script>
</body>
</html>
